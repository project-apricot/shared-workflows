name: 'Publish .NET library to nuget.org'
description: 'Build, test, pack and push a tagged .NET library using nuget.org trusted publishing.'

# The calling job must grant `id-token: write`.

inputs:
  tag:
    description: 'Release tag, with or without the leading v (e.g. v1.2.0).'
    required: true
  nuget_user:
    description: 'nuget.org profile name the trusted publishing policy is bound to.'
    required: true
  solution_file:
    description: 'Solution or project to build. Empty lets dotnet auto-discover it.'
    required: false
    default: ''
  dotnet_versions:
    description: 'Newline-separated SDK versions to install.'
    required: false
    default: '10.0.x'
  allow_prerelease:
    description: 'Push prerelease versions. nuget.org carries stable releases only by default.'
    required: false
    default: 'false'

outputs:
  version:
    description: 'The version that was published.'
    value: ${{ steps.version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Resolve version from tag
      id: version
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        VERSION="${TAG#v}"
        if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
          echo "::error::Tag '$TAG' does not carry a valid semantic version."
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        case "$VERSION" in
          *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
          *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
        esac

    - name: Validate publish configuration
      shell: bash
      env:
        NUGET_USER: ${{ inputs.nuget_user }}
      run: |
        if [ -z "$NUGET_USER" ]; then
          echo "::error::nuget_user is empty. Set it with: gh secret set NUGET_USER --body '<nuget.org profile name>'"
          exit 1
        fi

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet_versions }}

    - name: Restore
      shell: bash
      env:
        SOLUTION: ${{ inputs.solution_file }}
      run: dotnet restore ${SOLUTION:+"$SOLUTION"}

    - name: Build
      shell: bash
      env:
        SOLUTION: ${{ inputs.solution_file }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        dotnet build ${SOLUTION:+"$SOLUTION"} \
          --no-restore -c Release \
          -p:Version="$VERSION" \
          -p:ContinuousIntegrationBuild=true

    - name: Test
      shell: bash
      env:
        SOLUTION: ${{ inputs.solution_file }}
      run: dotnet test ${SOLUTION:+"$SOLUTION"} --no-build -c Release

    - name: Pack
      shell: bash
      env:
        SOLUTION: ${{ inputs.solution_file }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        dotnet pack ${SOLUTION:+"$SOLUTION"} \
          --no-build -c Release -o ./artifacts \
          -p:Version="$VERSION" \
          -p:PackageVersion="$VERSION" \
          -p:ContinuousIntegrationBuild=true

    - name: Upload packages
      uses: actions/upload-artifact@v7
      with:
        name: packages-${{ steps.version.outputs.version }}
        path: ./artifacts/*
        if-no-files-found: error

    - name: Skip publish for prerelease version
      if: ${{ steps.version.outputs.prerelease == 'true' && inputs.allow_prerelease != 'true' }}
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        echo "::notice::'$VERSION' is a prerelease and allow_prerelease is false - not pushed."
        {
          echo "### Not published"
          echo ""
          echo "\`${VERSION}\` is a prerelease. nuget.org carries stable releases only."
          echo "The package is attached to this run as an artifact."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Log in to NuGet
      id: nuget-login
      if: ${{ steps.version.outputs.prerelease == 'false' || inputs.allow_prerelease == 'true' }}
      uses: NuGet/login@v1
      with:
        user: ${{ inputs.nuget_user }}

    - name: Push to nuget.org
      if: ${{ steps.version.outputs.prerelease == 'false' || inputs.allow_prerelease == 'true' }}
      shell: bash
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        dotnet nuget push "./artifacts/*.nupkg" \
          --source https://api.nuget.org/v3/index.json \
          --api-key "$NUGET_API_KEY" \
          --skip-duplicate

    - name: Summary
      if: ${{ steps.version.outputs.prerelease == 'false' || inputs.allow_prerelease == 'true' }}
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        {
          echo "### Published"
          echo ""
          echo "\`${VERSION}\` -> [nuget.org](https://www.nuget.org/packages?q=${VERSION})"
        } >> "$GITHUB_STEP_SUMMARY"
